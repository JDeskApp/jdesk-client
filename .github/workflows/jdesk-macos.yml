name: J Desk - macOS (Apple Silicon)

# Compila o J Desk para Mac com chip Apple (M1 a M4) e entrega um .dmg SEM assinatura da Apple.
# Uso previsto: computadores dos técnicos. Na primeira abertura: botão direito > Abrir > Abrir.
# Rodar manualmente: Actions > "J Desk - macOS (Apple Silicon)" > Run workflow.

on:
  workflow_dispatch:

env:
  MAC_RUST_VERSION: "1.81" # 1.81 is requred for macos, because of https://github.com/yury/cidre requires 1.81
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VERSION: "1.5.1"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-jdesk-macos:
    name: aarch64-apple-darwin
    runs-on: macos-14
    needs: [generate-bridge]
    env:
      RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
      JDESK_SERVER: ${{ vars.JDESK_SERVER || 'suporte.fc3consultoria.com.br' }}
      JDESK_PAINEL: ${{ vars.JDESK_PAINEL || 'https://jdesk.fc3consultoria.com.br' }}
    steps:
      - name: Conferir configuracao do J Desk
        shell: bash
        run: |
          if [ -z "$RS_PUB_KEY" ]; then
            echo "::error::Segredo RS_PUB_KEY nao configurado (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          echo "Servidor J Desk: $JDESK_SERVER"
          echo "Painel J Desk: $JDESK_PAINEL"

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Marca J Desk no app do Mac (nome, link jdesk:// e icone)
        shell: bash
        run: |
          set -e
          # O codigo do Mac procura /Applications/<nome do app>.app, e o nome do app e "JDesk"
          sed -i '' -e 's/^PRODUCT_NAME = .*/PRODUCT_NAME = JDesk/' flutter/macos/Runner/Configs/AppInfo.xcconfig
          sed -i '' -e 's/RustDesk\.app/JDesk.app/g' build.py
          # Link do botao Conectar do painel: jdesk://
          sed -i '' -e 's#<string>rustdesk</string>#<string>jdesk</string>#' flutter/macos/Runner/Info.plist
          grep -n "PRODUCT_NAME" flutter/macos/Runner/Configs/AppInfo.xcconfig
          grep -n "<string>jdesk</string>" flutter/macos/Runner/Info.plist
          # Icone J Desk a partir de res/icon.png
          ICONSET=/tmp/AppIcon.iconset
          mkdir -p "$ICONSET"
          for s in 16 32 128 256 512; do
            sips -z $s $s res/icon.png --out "$ICONSET/icon_${s}x${s}.png" >/dev/null
            d=$((s*2))
            sips -z $d $d res/icon.png --out "$ICONSET/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o flutter/macos/Runner/AppIcon.icns
          ls -l flutter/macos/Runner/AppIcon.icns

      - name: Install build runtime
        run: |
          brew install llvm create-dmg
          if command -v pkg-config &>/dev/null; then
              echo "pkg-config is already installed"
          else
              brew install pkg-config
          fi

      - name: Install NASM
        run: |
          # NASM 2.16.x (a 3.x do brew e incompativel com as bibliotecas de video)
          wget https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip
          unzip nasm-2.16.03-macosx.zip
          sudo cp nasm-2.16.03/nasm /usr/local/bin/nasm
          nasm --version

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]]; then
            git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Workaround for flutter issue
        shell: bash
        run: |
          cd "$(dirname "$(which flutter)")"
          # https://github.com/flutter/flutter/issues/133533
          sed -i -e 's/_setFramesEnabledState(false);/\/\/_setFramesEnabledState(false);/g' ../packages/flutter/lib/src/scheduler/binding.dart
          grep -n '_setFramesEnabledState(false);' ../packages/flutter/lib/src/scheduler/binding.dart

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.MAC_RUST_VERSION }}
          targets: aarch64-apple-darwin
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: jdesk-macos-14

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi

      - name: Build J Desk
        run: |
          MIN_MACOS_VERSION="12.3"
          sed -i -e "s/MACOSX_DEPLOYMENT_TARGET\=[0-9]*.[0-9]*/MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}/" build.py
          sed -i -e "s/platform :osx, '.*'/platform :osx, '${MIN_MACOS_VERSION}'/" flutter/macos/Podfile
          sed -i -e "s/osx_minimum_system_version = \"[0-9]*.[0-9]*\"/osx_minimum_system_version = \"${MIN_MACOS_VERSION}\"/" Cargo.toml
          sed -i -e "s/MACOSX_DEPLOYMENT_TARGET = [0-9]*.[0-9]*;/MACOSX_DEPLOYMENT_TARGET = ${MIN_MACOS_VERSION};/" flutter/macos/Runner.xcodeproj/project.pbxproj
          export MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}
          ./build.py --flutter --hwcodec --unix-file-copy-paste --screencapturekit
          ls -la ./flutter/build/macos/Build/Products/Release/

      # Sem certificado da Apple: assinatura local (ad-hoc). Sem ela, o app alterado depois
      # da compilação chega no Mac como "danificado"; com ela, abre por Ajustes > Abrir Mesmo Assim.
      - name: Assinar (ad-hoc)
        run: |
          codesign --force --deep --sign - ./flutter/build/macos/Build/Products/Release/JDesk.app
          codesign --verify --deep --strict ./flutter/build/macos/Build/Products/Release/JDesk.app

      - name: Criar o instalador (.dmg)
        run: |
          CREATE_DMG="$(command -v create-dmg)"
          CREATE_DMG="$(readlink -f "$CREATE_DMG")"
          sed -i -e 's/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/' "$CREATE_DMG"
          create-dmg --volname "J Desk" --icon "JDesk.app" 200 190 --hide-extension "JDesk.app" --window-size 800 400 --app-drop-link 600 185 jdesk-macos-apple-silicon.dmg ./flutter/build/macos/Build/Products/Release/JDesk.app

      - name: Publicar jdesk-macos-apple-silicon.dmg
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jdesk-macos-apple-silicon
          path: jdesk-macos-apple-silicon.dmg
          if-no-files-found: error
